name: CI

# Build, vet, and test the Go backend on every PR and on pushes to main.
# Mirrors the local verify command from CLAUDE.md: go build ./... && go vet ./... && go test ./...
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-vet-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the version from go.mod so CI never drifts from the module.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
